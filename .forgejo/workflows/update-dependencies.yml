name: Propose dependency updates

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: paw-dependency-updates
  cancel-in-progress: false

jobs:
  propose:
    # Dispatch is deliberately limited to the reviewed integration branch.
    if: forgejo.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          github-server-url: ${{ forgejo.server_url }}
          ref: dev
          fetch-depth: 1
          persist-credentials: false
      - name: Install runner prerequisites
        run: |
          if command -v sudo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y git python3 xz-utils ca-certificates
          else
            apt-get update
            apt-get install -y git python3 xz-utils ca-certificates sudo
          fi
      - name: Preserve any pending dependency review
        id: pending
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          BASE_BRANCH: dev
        run: python3 scripts/ci/publish-update.py --check-open
      - uses: https://github.com/cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        if: steps.pending.outputs.open != 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
      - name: Discover stable releases and resolve candidate hashes
        if: steps.pending.outputs.open != 'true'
        id: candidate
        env:
          PAW_DISPOSABLE_UPDATE_CHECKOUT: "1"
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          nix shell --no-update-lock-file --inputs-from . nixpkgs#python3 \
            --command python3 scripts/update-dependencies.py
          if git diff --quiet -- nix/packages; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate candidate before proposing it
        if: steps.candidate.outputs.changed == 'true'
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: bash scripts/ci/check.sh
      - name: Open dependency review
        if: steps.candidate.outputs.changed == 'true'
        env:
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
          BASE_BRANCH: dev
        run: python3 scripts/ci/publish-update.py
