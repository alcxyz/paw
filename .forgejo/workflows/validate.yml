name: Validate PAW

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          github-server-url: ${{ forgejo.server_url }}
          persist-credentials: false
      - name: Install runner prerequisites
        run: |
          if command -v sudo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y git python3 xz-utils ca-certificates
          else
            apt-get update
            apt-get install -y git python3 xz-utils ca-certificates sudo
          fi
      - uses: https://github.com/cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            sandbox-fallback = false
      - name: Validate pinned build and image contracts
        env:
          FORGEJO_TOKEN: ""
          GITHUB_TOKEN: ""
        run: bash scripts/ci/check.sh
