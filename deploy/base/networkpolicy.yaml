apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-default-deny
  labels:
    app.kubernetes.io/name: paw
    app.kubernetes.io/component: workspace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: paw
      app.kubernetes.io/component: workspace
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
