apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-state
  labels:
    app.kubernetes.io/name: paw
    app.kubernetes.io/component: workspace
    paw.alc.xyz/managed-by: paw
  annotations:
    paw.alc.xyz/state-policy: retain-until-destroy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-work
  labels:
    app.kubernetes.io/name: paw
    app.kubernetes.io/component: workspace
    paw.alc.xyz/managed-by: paw
  annotations:
    paw.alc.xyz/state-policy: retain-until-destroy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
