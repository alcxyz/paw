apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-state
  labels:
    app.kubernetes.io/name: paw
    app.kubernetes.io/component: workspace
  annotations:
    paw.alc.xyz/state-policy: ephemeral
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
