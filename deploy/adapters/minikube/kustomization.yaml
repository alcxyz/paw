apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
images:
  - name: registry.invalid/paw/workspace
    newName: paw-core
    newTag: dev
  - name: registry.invalid/paw/egress-proxy
    newName: paw-egress-proxy
    newTag: dev
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: workspace
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: egress
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
